<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- The source of the share card (`website/assets/og.png`). It is rendered by hand: open this
     file at a 1200x630 viewport (2x for sharpness) and screenshot it — the site's build has no
     browser in it and never will. Its text is deliberately timeless: no version, no counts,
     because a card that says "1 841 names" is a card that is wrong in three weeks. -->
<style>
  :root {
    --bg: #080a0d; --bg-soft: #0b0e13; --line: #1c232e; --text: #e7edf5;
    --text-soft: #c3cedd; --muted: #8b99ab; --accent: #8ef0b1;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; background: var(--bg); color: var(--text);
    font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 72px; position: relative;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(680px 340px at 78% -12%, rgba(142,240,177,.16), transparent 70%),
      radial-gradient(560px 300px at 8% 108%, rgba(120,140,255,.14), transparent 72%);
  }
  .top { display: flex; align-items: center; gap: 18px; position: relative; }
  .mark { width: 46px; height: 46px; }
  .name { font-size: 30px; font-weight: 650; letter-spacing: -.01em; }
  .ver {
    font-family: var(--mono); font-size: 15px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px;
  }
  h1 { font-size: 92px; line-height: 1.02; letter-spacing: -.035em; font-weight: 700; position: relative; }
  h1 em { font-style: normal; color: var(--accent); }
  p.lede {
    font-size: 27px; line-height: 1.45; color: var(--text-soft); max-width: 880px;
    position: relative; margin-top: 26px;
  }
  .foot {
    display: flex; align-items: center; gap: 26px; font-family: var(--mono);
    font-size: 17px; color: var(--muted); position: relative;
  }
  .foot b { color: var(--text-soft); font-weight: 600; }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--line); }
  code { font-family: var(--mono); }
</style></head>
<body>
  <div class="glow"></div>
  <div class="top">
    <svg class="mark" viewBox="0 0 28 28" aria-hidden="true">
      <rect x="1" y="1" width="26" height="26" rx="7" fill="none" stroke="#8ef0b1" stroke-width="1.6"/>
      <path d="M6 9.5 L9.6 19 L13 12.4 L16.4 19 L22 9.5" fill="none" stroke="#8ef0b1"
            stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="name">WebC</span>
  </div>
  <div>
    <h1>Web apps in <em>C</em>,<br>end to end.</h1>
    <p class="lede">One language and one model declaration for the server and the
      browser — arenas instead of a collector, compiled to a single binary.</p>
  </div>
  <div class="foot">
    <span>C23 · one binary · both halves</span><span class="dot"></span>
    <span>Apache-2.0</span><span class="dot"></span>
    <span><code>bumasoft.github.io/WebC</code></span>
  </div>
</body></html>
